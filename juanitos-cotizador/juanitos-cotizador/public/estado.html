<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Estado del sistema | Juanitos Corporation</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="barra"><a class="marca" href="/">Juanitos <span>Corporation</span></a><nav><a href="/#cotizar">Volver al cotizador</a></nav></header>
<main class="legal">
  <h1>Estado del sistema</h1>
  <p id="resumen">Revisando las conexiones…</p>
  <div class="seguimiento"><ol id="traza" class="traza"></ol></div>
  <p class="letra" id="fecha"></p>
  <p class="letra">El resultado se guarda hasta un minuto. Los códigos están explicados en el README del proyecto.</p>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
fetch('/api/health').then((r) => r.json()).then((d) => {
  document.getElementById('resumen').textContent = d.ok ? 'Todas las conexiones responden.' : 'Hay al menos una conexión con problemas. La primera que falla suele ser la causa de las demás.';
  document.getElementById('traza').innerHTML = d.checks.map((c) => `<li class="t-${c.ok ? 'ok' : c.codigo && c.codigo[0] === 'A' ? 'aviso' : 'fallo'}"><span class="t-nombre">${esc(c.nombre)}</span><span class="t-estado">${c.ok ? 'Listo' : 'Falló'}${c.codigo ? ' · ' + esc(c.codigo) : ''}</span><span class="t-detalle">${esc(c.detalle)}</span></li>`).join('');
  document.getElementById('fecha').textContent = 'Revisado: ' + new Date(d.fecha).toLocaleString('es-MX');
}).catch(() => { document.getElementById('resumen').textContent = 'No se pudo consultar /api/health: el servidor no respondió.'; });
</script>
</body>
</html>
